  var TOUR_BEATS = [

  var stage = document.getElementById("stage");
  var world = document.getElementById("world");
  var edgesSvg = document.getElementById("edges");
  var cardsDiv = document.getElementById("cards");
  var state = { x:0, y:0, k:1, dragging:false, lastX:0, lastY:0 };

  function makeEl(tag, cls, txt) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (txt) el.textContent = txt;
    return el;
  }

  function clearChildren(el) {
    while (el.firstChild) { el.removeChild(el.firstChild); }
  }

  function renderCard(pin) {
    var el = document.createElement("div");
    el.className = "card";
    el.id = "card-" + pin.id;
    el.style.left = pin.x + "px";
    el.style.top = pin.y + "px";
    el.dataset.id = pin.id;

    if (pin.type === "person") {
      el.classList.add("cdcr-id");
      el.appendChild(makeEl("div", "cdcr-header", "PERSON OF RECORD"));
      var photo = makeEl("div", "cdcr-photo", "?");
      el.appendChild(photo);
      var info = makeEl("div", "cdcr-info");
      info.appendChild(makeEl("div", "cdcr-name", pin.name));
      var det = makeEl("div", "cdcr-details");
      det.appendChild(document.createTextNode((pin.years || "") + "\n"));
      det.appendChild(document.createElement("br"));
      det.appendChild(document.createTextNode(pin.role));
      info.appendChild(det);
      el.appendChild(info);
      el.appendChild(makeEl("div", "cdcr-stamp", "CITATION FILED"));
    } else if (pin.type === "institution") {
      var hdr = makeEl("div", "card-header");
      hdr.appendChild(makeEl("div", "card-title", pin.name));
      el.appendChild(hdr);
      el.appendChild(makeEl("div", "card-body", pin.desc));
      var foot = makeEl("div", "card-footer");
      foot.textContent = "Related: " + (pin.related || []).join(", ");
      el.appendChild(foot);
    } else if (pin.type === "event") {
      var hdr2 = makeEl("div", "card-header");
      hdr2.appendChild(makeEl("div", "card-title", pin.name));
      hdr2.appendChild(makeEl("div", "card-subtitle", pin.date));
      el.appendChild(hdr2);
      el.appendChild(makeEl("div", "card-body", pin.desc));
      var foot2 = makeEl("div", "card-footer");
      foot2.textContent = "Source: " + pin.source;
      el.appendChild(foot2);
    }

    el.addEventListener("click", function() { showInfo(pin); });
    return el;
  }

  function renderPin(pin) {
    var p = document.createElement("div");
    p.className = "pin " + (pin.type === "event" ? "yellow" : "red");
    p.style.left = (pin.x + 140) + "px";
    p.style.top = (pin.y - 6) + "px";
    return p;
  }

  PINS.forEach(function(pin) {
    cardsDiv.appendChild(renderCard(pin));
    cardsDiv.appendChild(renderPin(pin));
  });

  function renderEdges() {
    clearChildren(edgesSvg);
    EDGES.forEach(function(edge) {
      var s = PINS.find(function(p){ return p.id === edge.source; });
      var t = PINS.find(function(p){ return p.id === edge.target; });
      if (!s || !t) return;
      var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", s.x + 140);
      line.setAttribute("y1", s.y + 80);
      line.setAttribute("x2", t.x + 140);
      line.setAttribute("y2", t.y + 80);
      line.setAttribute("class", "string " + (edge.document ? "doc" : ""));
      edgesSvg.appendChild(line);
    });
  }
  renderEdges();

  function updateTransform() {
    world.style.transform = "translate(" + state.x + "px," + state.y + "px) scale(" + state.k + ")";
    document.getElementById("zoom-indicator").textContent = Math.round(state.k * 100) + "%";
  }
  updateTransform();

  stage.addEventListener("mousedown", function(e) {
    if (e.target.closest(".card") || e.target.closest(".btn")) return;
    state.dragging = true; state.lastX = e.clientX; state.lastY = e.clientY;
  });
  window.addEventListener("mousemove", function(e) {
    if (!state.dragging) return;
    state.x += e.clientX - state.lastX;
    state.y += e.clientY - state.lastY;
    state.lastX = e.clientX; state.lastY = e.clientY;
    updateTransform();
  });
  window.addEventListener("mouseup", function() { state.dragging = false; });

  stage.addEventListener("wheel", function(e) {
    e.preventDefault();
    var zoomSpeed = 0.001;
    var newK = state.k * (1 - e.deltaY * zoomSpeed);
    newK = Math.max(0.3, Math.min(3, newK));
    var rect = stage.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    state.x = mx - (mx - state.x) * (newK / state.k);
    state.y = my - (my - state.y) * (newK / state.k);
    state.k = newK;
    updateTransform();
  }, { passive: false });

  document.getElementById("zoom-in").addEventListener("click", function() {
    state.k = Math.min(3, state.k * 1.2); updateTransform();
  });
  document.getElementById("zoom-out").addEventListener("click", function() {
    state.k = Math.max(0.3, state.k / 1.2); updateTransform();
  });
  document.getElementById("reset-view").addEventListener("click", function() {
    state.x = 0; state.y = 0; state.k = 1; updateTransform();
  });

  var infoPanel = document.getElementById("info-panel");
  function showInfo(pin) {
    document.getElementById("info-title").textContent = pin.name;
    var body = document.getElementById("info-body");
    clearChildren(body);
    if (pin.type === "person") {
      if (pin.years) body.appendChild(document.createTextNode("Years: " + pin.years + "\n\n"));
      body.appendChild(document.createTextNode("Role: " + pin.role));
    } else if (pin.type === "institution") {
      body.appendChild(document.createTextNode(pin.desc));
    } else if (pin.type === "event") {
      body.appendChild(document.createTextNode("Date: " + pin.date + "\n\n" + pin.desc));
    }
    document.getElementById("info-citation").textContent = (pin.source || "");
    infoPanel.style.display = "block";
  }

  stage.addEventListener("click", function(e) {
    if (!e.target.closest(".card")) infoPanel.style.display = "none";
  });

  var tourState = { active:false, currentBeat:0 };
  var tourOverlay = document.getElementById("tour-overlay");
  var tourControls = document.getElementById("tour-controls");

  function showBeat(idx) {
    var beat = TOUR_BEATS[idx];
    if (!beat) return;
    document.getElementById("tour-title").textContent = beat.title;
    document.getElementById("tour-desc").textContent = beat.caption;
    var start = { x: state.x, y: state.y, k: state.k };
    var end = { x: -beat.camera.x * beat.camera.k + stage.clientWidth/2 - 140*beat.camera.k,
                y: -beat.camera.y * beat.camera.k + stage.clientHeight/2 - 80*beat.camera.k,
                k: beat.camera.k };
    var startTime = performance.now();
    function step(now) {
      var t = Math.min(1, (now - startTime) / 800);
      var ease = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
      state.x = start.x + (end.x - start.x) * ease;
      state.y = start.y + (end.y - start.y) * ease;
      state.k = start.k + (end.k - start.k) * ease;
      updateTransform();
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
    document.querySelectorAll(".card").forEach(function(c) { c.style.boxShadow = ""; });
    (beat.highlight || []).forEach(function(id) {
      var c = document.getElementById("card-" + id);
      if (c) c.style.boxShadow = "0 0 0 3px var(--spray-red), 0 4px 16px rgba(255,0,0,0.3)";
    });
  }

  function startTour() {
    tourState.active = true; tourState.currentBeat = 0;
    tourOverlay.classList.add("active");
    tourControls.classList.add("active");
    showBeat(0);
  }
  function nextBeat() {
    if (tourState.currentBeat < TOUR_BEATS.length - 1) {
      tourState.currentBeat++; showBeat(tourState.currentBeat);
    } else { endTour(); }
  }
  function prevBeat() {
    if (tourState.currentBeat > 0) { tourState.currentBeat--; showBeat(tourState.currentBeat); }
  }
  function endTour() {
    tourState.active = false;
    tourOverlay.classList.remove("active");
    tourControls.classList.remove("active");
    document.querySelectorAll(".card").forEach(function(c) { c.style.boxShadow = ""; });
  }

  document.getElementById("tour-trigger").addEventListener("click", startTour);
  document.getElementById("tour-next").addEventListener("click", nextBeat);
  document.getElementById("tour-next-btn").addEventListener("click", nextBeat);
  document.getElementById("tour-prev").addEventListener("click", prevBeat);
  document.getElementById("tour-close").addEventListener("click", endTour);

  var titleEl = document.getElementById("intro-title");
  var subtitleEl = document.getElementById("intro-subtitle");
  var authorEl = document.getElementById("intro-author");
  var intro = document.getElementById("intro");
  var TITLE_TEXT = "CAPITAL HAS NO RELIGION";

  function typewriter(el, text, speed, cb) {
    var i = 0;
    function tick() {
      if (i < text.length) { el.textContent += text.charAt(i); i++; setTimeout(tick, speed); }
      else if (cb) cb();
    }
    tick();
  }

  setTimeout(function() { typewriter(titleEl, TITLE_TEXT, 60, function() {
    setTimeout(function() { subtitleEl.classList.add("visible"); }, 400);
    setTimeout(function() { authorEl.classList.add("visible"); }, 800);
    setTimeout(function() { intro.style.opacity = "0"; intro.style.transition = "opacity 1s"; }, 3000);
    setTimeout(function() { intro.style.display = "none"; }, 4000);
  });}, 600);

})();
</script>
